name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" >/dev/null
      - name: Build
        env:
          KEYSTORE: key.jks
          KEYSTORE_PASS: tvhome123
        run: sh build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tvhome-apk
          path: out/tvhome.apk
      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create latest out/tvhome.apk --repo "$GITHUB_REPOSITORY" --title "Home Chelsea ($(date -u +%Y-%m-%d\ %H:%M))" --notes "Build automatico" --target "$GITHUB_SHA"
